<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===========================
         LEADERBOARD PAGE
         Public XP ranking — visible to logged-out visitors
         =========================== -->
    <meta charset="UTF-8">
    <script>!function(){var t=localStorage.getItem("cnote-theme");if(t===null)t="dark";if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;var a=localStorage.getItem("cnote-accent-color");if(a&&localStorage.getItem("cn_session")){var r=parseInt(a.slice(1,3),16),g=parseInt(a.slice(3,5),16),b=parseInt(a.slice(5,7),16),s=document.documentElement.style;s.setProperty("--accent-color",a);s.setProperty("--accent-light","#"+[r,g,b].map(function(c){return Math.min(255,Math.floor(c+(255-c)*.2)).toString(16).padStart(2,"0")}).join(""));s.setProperty("--accent-rgb",r+", "+g+", "+b);s.setProperty("--accent-color-rgb",r+", "+g+", "+b);s.setProperty("--glow-accent","0 0 20px rgba("+r+", "+g+", "+b+", .15)")}}()</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="See the top contributors on Console Notebook, ranked by XP earned across the community.">
    <meta name="theme-color" content="#1B1714">
    <meta property="og:title" content="Leaderboard — Console Notebook">
    <meta property="og:description" content="See the top contributors on Console Notebook, ranked by XP earned across the community.">
    <meta property="og:url" content="https://consolenotebook.com/html/pages/leaderboard.html">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://consolenotebook.com/assets/images/og-image.png">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../manifest.json">
    <link rel="canonical" href="https://consolenotebook.com/html/pages/leaderboard.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Leaderboard — Console Notebook</title>
    <link rel="stylesheet" href="../../css/main.css?v=20260909">
    <link rel="stylesheet" href="../../css/components/levels.css">
</head>
<body class="has-mbn">
    <div id="navbar-placeholder"></div>

    <main class="lb-page">
        <header class="lb-header">
            <h1 class="lb-header__title" data-i18n="leaderboard_title">Leaderboard</h1>
            <p class="lb-header__subtitle" data-i18n="leaderboard_subtitle">Top contributors, ranked by XP earned across the community.</p>
        </header>

        <div class="lb-you" id="lb-you" hidden>
            <span class="lb-you__label" data-i18n="leaderboard_your_rank">Your rank</span>
            <span class="lb-you__rank" id="lb-you-rank">—</span>
            <span class="lb-you__xp" id="lb-you-xp"></span>
        </div>

        <div class="lb-loading" id="lb-loading" data-i18n="leaderboard_loading">Loading…</div>
        <div class="lb-empty" id="lb-empty" hidden data-i18n="leaderboard_empty">No ranked members yet — be the first!</div>
        <div class="lb-list" id="lb-list" aria-live="polite"></div>

        <button type="button" class="lb-load-more" id="lb-load-more" hidden data-i18n="leaderboard_load_more">Load more</button>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="../../js/data/consoles-data.js"></script>
    <script type="module" src="../../js/main.js?v=20260909"></script>
    <script type="module" src="../../js/pages/leaderboard.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../../js/fallback/search-profile.js"></script>
    <script src="/js/cookie-consent.js"></script>
    <script src="../js/components.js"></script>
</body>
</html>
