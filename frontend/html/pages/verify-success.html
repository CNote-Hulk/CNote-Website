<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===========================
         EMAIL VERIFICATION SUCCESS PAGE
         Confirmation after email verification
         =========================== -->
    <meta charset="UTF-8">
    <script>!function(){var t=localStorage.getItem("cnote-theme");if(t===null)t="dark";if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;var a=localStorage.getItem("cnote-accent-color");if(a&&localStorage.getItem("cn_session")){var r=parseInt(a.slice(1,3),16),g=parseInt(a.slice(3,5),16),b=parseInt(a.slice(5,7),16),s=document.documentElement.style;s.setProperty("--accent-color",a);s.setProperty("--accent-light","#"+[r,g,b].map(function(c){return Math.min(255,Math.floor(c+(255-c)*.2)).toString(16).padStart(2,"0")}).join(""));s.setProperty("--accent-rgb",r+", "+g+", "+b);s.setProperty("--accent-color-rgb",r+", "+g+", "+b);s.setProperty("--glow-accent","0 0 20px rgba("+r+", "+g+", "+b+", .15)")}}()</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Email Verification — Console Notebook">
    <meta name="theme-color" content="#1B1714">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../manifest.json">
    <title>Email Verification — Console Notebook</title>
    <link rel="stylesheet" href="../../css/main.css?v=20260909c">
</head>
<body>
    <!-- NAVIGATION BAR -->
    <div id="navbar-placeholder"></div>

    <div class="auth-page">
        <div class="auth-card auth-card--standalone">
            <div id="verify-loading">
                <h1 class="auth-card__title" data-i18n="verify_loading_title">Verifying…</h1>
            </div>
            <div id="verify-success" hidden>
                <h1 class="auth-card__title" data-i18n="verify_success_title">✅ Email Verified</h1>
                <p class="auth-card__subtitle" id="verify-success-msg" data-i18n="verify_success_message">Email successfully verified! You can now log in.</p>
                <a href="login.html" class="auth-btn" data-i18n="verify_success_login" style="display:inline-block;text-align:center;text-decoration:none;margin-top:16px;">Log in</a>
            </div>
            <div id="verify-error" hidden>
                <h1 class="auth-card__title" data-i18n="verify_error_title">❌ Verification Failed</h1>
                <p class="auth-card__subtitle" id="verify-error-msg" data-i18n="verify_error_message">Invalid or expired link.</p>
                <button type="button" id="verify-resend-btn" class="auth-btn" data-i18n="verify_error_resend" style="display:inline-block;text-align:center;text-decoration:none;margin-top:16px;">Resend verification email</button>
                <a href="login.html" class="auth-btn" data-i18n="verify_error_login" style="display:inline-block;text-align:center;text-decoration:none;margin-top:12px;">Log in</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/data/consoles-data.js"></script>
    <script type="module" src="../../js/main.js?v=20260909"></script>
    <script type="module" src="../../js/pages/verify-success.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <script src="../../js/fallback/search-profile.js"></script>
    <script src="/js/cookie-consent.js"></script>
    <script src="../js/components.js"></script>
</body>
</html>
