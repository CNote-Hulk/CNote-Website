<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===========================
         CNOTE SHOP — build your package from CNote's own stock
         ?console=<id>: pick a console unit (model), a mod, a storage
         upgrade and accessories, then order (no payment on the site).
         Tabs: package / my orders; admins also get stock + orders.
         Logic in pages/shop.js, API routes/shop.js.
         =========================== -->
    <meta charset="UTF-8">
    <script>!function(){if(localStorage.getItem("cnote-pixel-art")==="off")document.documentElement.classList.add("no-pixel");var t=localStorage.getItem("cnote-theme");if(t===null)t="dark";if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;var a=localStorage.getItem("cnote-accent-color");if(a&&localStorage.getItem("cn_session")){var r=parseInt(a.slice(1,3),16),g=parseInt(a.slice(3,5),16),b=parseInt(a.slice(5,7),16),s=document.documentElement.style;s.setProperty("--accent-color",a);s.setProperty("--accent-light","#"+[r,g,b].map(function(c){return Math.min(255,Math.floor(c+(255-c)*.2)).toString(16).padStart(2,"0")}).join(""));s.setProperty("--accent-rgb",r+", "+g+", "+b);s.setProperty("--accent-color-rgb",r+", "+g+", "+b);s.setProperty("--glow-accent","0 0 20px rgba("+r+", "+g+", "+b+", .15)")}}()</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consoles from the CNote shelf: choose the model, the mod and the extras, and order directly.">
    <meta name="theme-color" content="#1B1714">
    <meta property="og:title" content="CNote Shop — Console Notebook">
    <meta property="og:description" content="Consoles from the CNote shelf: choose the model, the mod and the extras, and order directly.">
    <meta property="og:url" content="https://consolenotebook.com/html/pages/shop.html">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://consolenotebook.com/assets/images/og-image.png">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../manifest.json">
    <link rel="canonical" href="https://consolenotebook.com/html/pages/shop.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>CNote Shop — Console Notebook</title>
    <link rel="stylesheet" href="../../css/main.css?v=20261126">
    <link rel="stylesheet" href="../../css/pages/shop.css?v=20261126c">
</head>
<body class="has-mbn">
    <div id="navbar-placeholder"></div>

    <main class="shop-page">
        <div class="container">
            <header class="shop-hero">
                <p class="shop-hero__kicker" data-i18n="shop_kicker">CNote Shop</p>
                <h1 class="shop-hero__title" id="shop-title" data-i18n="shop_title">Build your package</h1>
                <p class="shop-hero__subtitle" data-i18n="shop_subtitle">Consoles from the CNote shelf — choose the model, the mod and the extras, and order directly.</p>
            </header>

            <nav class="shop-tabs" id="shop-tabs" role="tablist">
                <button type="button" role="tab" class="shop-tab is-active" data-tab="build" data-i18n="shop_tab_build">Package</button>
                <button type="button" role="tab" class="shop-tab" data-tab="mine" data-i18n="shop_tab_mine">My orders</button>
                <button type="button" role="tab" class="shop-tab" data-tab="stock" data-admin hidden data-i18n="shop_tab_stock">Stock</button>
                <button type="button" role="tab" class="shop-tab" data-tab="orders" data-admin hidden data-i18n="shop_tab_orders">Orders</button>
            </nav>

            <section class="shop-panel" id="shop-build"></section>
            <section class="shop-panel" id="shop-mine" hidden></section>
            <section class="shop-panel" id="shop-stock" hidden></section>
            <section class="shop-panel" id="shop-orders" hidden></section>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script type="module" src="../../js/main.js?v=20261126c"></script>
    <script type="module" src="../../js/pages/shop.js?v=20261126e"></script>
    <script src="/js/cookie-consent.js"></script>
    <script src="../js/components.js"></script>
</body>
</html>
