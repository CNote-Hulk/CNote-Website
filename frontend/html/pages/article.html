<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===========================
         ARTICLE — single blog post detail page
         Dynamic via ?slug=... (like console-model.html); admin sees
         Edit/Delete buttons on every article.
         =========================== -->
    <meta charset="UTF-8">
    <script>!function(){var t=localStorage.getItem("cnote-theme");if(t===null)t="dark";if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;var a=localStorage.getItem("cnote-accent-color");if(a&&localStorage.getItem("cn_session")){var r=parseInt(a.slice(1,3),16),g=parseInt(a.slice(3,5),16),b=parseInt(a.slice(5,7),16),s=document.documentElement.style;s.setProperty("--accent-color",a);s.setProperty("--accent-light","#"+[r,g,b].map(function(c){return Math.min(255,Math.floor(c+(255-c)*.2)).toString(16).padStart(2,"0")}).join(""));s.setProperty("--accent-rgb",r+", "+g+", "+b);s.setProperty("--accent-color-rgb",r+", "+g+", "+b);s.setProperty("--glow-accent","0 0 20px rgba("+r+", "+g+", "+b+", .15)")}}()</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Console Notebook article">
    <meta name="theme-color" content="#1B1714">
    <meta property="og:title" content="Console Notebook article">
    <meta property="og:description" content="Console Notebook article">
    <meta property="og:type" content="article">
    <meta property="og:image" content="https://consolenotebook.com/assets/images/og-image.png">
    <meta property="og:url" content="https://consolenotebook.com/html/pages/article.html">
    <link rel="canonical" href="https://consolenotebook.com/html/pages/article.html" />
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../manifest.json">
    <title id="article-doc-title">Article — Console Notebook</title>
    <link rel="stylesheet" href="../../css/main.css?v=20260909c">
    <link rel="stylesheet" href="../../css/pages/lesson.css?v=20260909">
    <link rel="stylesheet" href="../../css/pages/articles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="has-mbn">
    <div id="navbar-placeholder"></div>

    <main class="article-page">
        <div class="container container--narrow">

            <div class="article-loading" id="article-loading" data-i18n="articles_loading">Loading…</div>

            <div class="article-notfound" id="article-notfound" hidden>
                <span class="article-notfound__icon">📰</span>
                <h1 data-i18n="articles_notfound_title">Article not found</h1>
                <a href="articles.html" data-i18n="articles_notfound_link">← Back to articles</a>
            </div>

            <article class="article-view" id="article-view" hidden>
                <a href="articles.html" class="article-view__back" data-i18n="articles_back_link">← All articles</a>

                <img class="article-view__cover" id="article-cover" hidden alt="">

                <h1 class="article-view__title" id="article-title"></h1>
                <div class="article-view__meta">
                    <span id="article-author"></span> · <span id="article-date"></span> · <span id="article-views"></span>
                </div>

                <div class="article-admin-actions" id="article-admin-actions" hidden>
                    <button type="button" class="hub-btn hub-btn--secondary" id="article-edit-btn" data-i18n="articles_edit">✎ Edit</button>
                    <button type="button" class="hub-btn hub-btn--secondary" id="article-delete-btn" data-i18n="articles_delete">🗑 Delete</button>
                </div>

                <div class="lsn-content" id="article-content"></div>
            </article>

        </div>
    </main>

    <!-- Edit article modal (admin only) — same markup/classes as articles.html's create modal -->
    <div class="article-modal-overlay" id="article-modal-overlay" hidden>
        <div class="article-modal">
            <button type="button" class="article-modal__close" id="article-modal-close" aria-label="Close">&times;</button>
            <h2 data-i18n="articles_edit_modal_title">Edit article</h2>
            <form id="article-form">
                <label class="article-form__label" data-i18n="articles_field_title">Title</label>
                <input type="text" id="article-title-input" class="hub-form-input" maxlength="200" required>

                <label class="article-form__label" data-i18n="articles_field_excerpt">Excerpt</label>
                <textarea id="article-excerpt-input" class="hub-form-textarea" rows="2" maxlength="400"></textarea>

                <label class="article-form__label" data-i18n="articles_field_cover">Cover image</label>
                <div class="article-cover-upload">
                    <img class="article-cover-upload__preview" id="article-cover-preview" hidden alt="">
                    <label class="hero-button hero-button--syllabus article-cover-upload__btn">
                        <span data-i18n="articles_upload_cover">Upload cover image</span>
                        <input type="file" id="article-cover-input" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
                    </label>
                    <span class="article-cover-upload__status" id="article-cover-status"></span>
                </div>

                <label class="article-form__label" data-i18n="articles_field_content">Content (HTML)</label>
                <textarea id="article-content-input" class="hub-form-textarea article-form__content" rows="14" required></textarea>

                <label class="article-form__checkbox">
                    <input type="checkbox" id="article-published-input" checked>
                    <span data-i18n="articles_field_published">Published (visible to everyone)</span>
                </label>

                <div class="article-form__actions">
                    <button type="button" class="hub-btn hub-btn--secondary" id="article-form-cancel" data-i18n="articles_cancel">Cancel</button>
                    <button type="submit" class="hub-btn hub-btn--primary" id="article-form-submit" data-i18n="articles_save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script type="module" src="../../js/main.js?v=20260909"></script>
    <script type="module" src="../../js/pages/article.js?v=20260909"></script>
    <script src="/js/cookie-consent.js"></script>
    <script src="../js/components.js"></script>
</body>
</html>
