    <script>!function(){var t=localStorage.getItem("cnote-theme");if(t===null)t="dark";if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;var a=localStorage.getItem("cnote-accent-color");if(a&&localStorage.getItem("cn_session")){var r=parseInt(a.slice(1,3),16),g=parseInt(a.slice(3,5),16),b=parseInt(a.slice(5,7),16),s=document.documentElement.style;s.setProperty("--accent-color",a);s.setProperty("--accent-light","#"+[r,g,b].map(function(c){return Math.min(255,Math.floor(c+(255-c)*.2)).toString(16).padStart(2,"0")}).join(""));s.setProperty("--accent-rgb",r+", "+g+", "+b);s.setProperty("--accent-color-rgb",r+", "+g+", "+b);s.setProperty("--glow-accent","0 0 20px rgba("+r+", "+g+", "+b+", .15)")}}()</script>

<body class="community-navbar-page has-mbn">
    <!-- NAVIGATION BAR -->
    <div id="navbar-placeholder"></div>

    <div class="community-page community-page--hub">

        <div class="hub-mobile-overlay" id="hub-mobile-overlay"></div>

        <div class="community-hub">
            <!-- Sidebar -->
            <aside class="hub-sidebar" id="hub-sidebar">
                <div class="hub-sidebar__mobile-header">
                    <button class="hub-sidebar__close" id="hub-sidebar-close" data-i18n="community_menu" data-i18n-attr="aria-label" aria-label="Close menu">Menu</button>
                </div>
                <button class="hub-sidebar-toggle" id="hub-sidebar-toggle">☰ Menu</button>

                <div class="hub-sidebar__section">
                    <div class="hub-sidebar__heading" data-i18n="community_marketplace_heading">Marketplace</div>
                    <button class="hub-sidebar__item hub-sidebar__item--active" data-view="marketplace" data-category="" data-i18n="community_marketplace_all">🛒 Toate</button>
                    <button class="hub-sidebar__item" data-view="marketplace" data-category="consoles" data-i18n="community_marketplace_consoles">🕹️ Console</button>
                    <button class="hub-sidebar__item" data-view="marketplace" data-category="games" data-i18n="community_marketplace_games">🎮 Jocuri</button>
                    <button class="hub-sidebar__item" data-view="marketplace" data-category="accessories" data-i18n="community_marketplace_accessories">🎧 Accesorii</button>
                    <button class="hub-sidebar__item" data-view="marketplace" data-category="parts" data-i18n="community_marketplace_parts">🔩 Parts / Repairs</button>
                </div>

                <div class="hub-sidebar__section">
                    <div class="hub-sidebar__heading" data-i18n="community_chat_heading">Chat</div>
                    <button class="hub-sidebar__item" data-view="dm"><span data-i18n="community_chat_unified">💬 Chat</span> <span class="hub-badge hub-badge--count" id="dm-unread-badge" hidden>0</span></button>
                    <button class="hub-sidebar__item" data-view="forum" data-console="general" data-i18n="community_forum_general">🌐 Forum General</button>
                    <button class="hub-sidebar__item" data-view="photos" data-i18n="community_photos_tab">📸 Community Photos</button>
                </div>

                <div class="hub-sidebar__section">
                    <div class="hub-sidebar__heading" data-i18n="community_retro_gaming_heading">Retro Gaming</div>
                    <div class="hub-sidebar__item hub-sidebar__item--locked">
                        <span data-i18n="community_games_chat">🎮 Community Games Chat</span>
                        <span class="hub-badge hub-badge--soon" data-i18n="community_coming_soon">Coming Soon</span>
                    </div>
                </div>

                <div class="hub-sidebar__section">
                    <div class="hub-sidebar__heading" data-i18n="community_console_categories">Console categories</div>
                    <div class="hub-sidebar__console">
                        <div class="hub-sidebar__console-name" style="--console-color:#0070D1">
                            <span class="hub-sidebar__console-dot"></span> <span data-i18n="community_console_playstation">PlayStation</span>
                        </div>
                        <button class="hub-sidebar__item" data-view="forum" data-console="ps" data-i18n="community_request_community">💬 Request community</button>
                        <button class="hub-sidebar__item" data-view="repair" data-console="ps" data-i18n="community_request_repair">🔧 Request repair</button>
                    </div>
                    <div class="hub-sidebar__console">
                        <div class="hub-sidebar__console-name" style="--console-color:#107C10">
                            <span class="hub-sidebar__console-dot"></span> <span data-i18n="community_console_xbox">Xbox</span>
                        </div>
                        <button class="hub-sidebar__item" data-view="forum" data-console="xbox" data-i18n="community_request_community">💬 Request community</button>
                        <button class="hub-sidebar__item" data-view="repair" data-console="xbox" data-i18n="community_request_repair">🔧 Request repair</button>
                    </div>
                    <div class="hub-sidebar__console">
                        <div class="hub-sidebar__console-name" style="--console-color:#E60012">
                            <span class="hub-sidebar__console-dot"></span> <span data-i18n="community_console_nintendo">Nintendo</span>
                        </div>
                        <button class="hub-sidebar__item" data-view="forum" data-console="nintendo" data-i18n="community_request_community">💬 Request community</button>
                        <button class="hub-sidebar__item" data-view="repair" data-console="nintendo" data-i18n="community_request_repair">🔧 Request repair</button>
                    </div>
                    <div class="hub-sidebar__console">
                        <div class="hub-sidebar__console-name" style="--console-color:#9B59B6">
                            <span class="hub-sidebar__console-dot"></span> <span data-i18n="community_console_pc">PC Gaming</span>
                        </div>
                        <button class="hub-sidebar__item" data-view="forum" data-console="pc" data-i18n="community_request_community">💬 Request community</button>
                        <button class="hub-sidebar__item" data-view="repair" data-console="pc" data-i18n="community_request_repair">🔧 Request repair</button>
                    </div>
                    <div class="hub-sidebar__console">

                    </div>

                <div class="hub-sidebar__section">

                </div>

            <!-- Content Area -->
            <main class="hub-content" id="hub-content">
                <!-- Forum -->
                <div class="hub-view" id="view-forum"></div>
                <!-- Thread detail -->
                <div class="hub-view" id="view-thread"></div>
                <!-- Repair wizard -->
                <div class="hub-view" id="view-repair"></div>
                <!-- Repair: my requests -->
                <div class="hub-view" id="view-repair-requests"></div>
                <!-- Repair: admin all requests -->
                <div class="hub-view" id="view-repair-admin"></div>
                <!-- Marketplace -->
                <div class="hub-view hub-view--active" id="view-marketplace"></div>
                <!-- Listing detail -->
                <div class="hub-view" id="view-listing"></div>
                <!-- Direct Messages + General Chat — share one two-pane layout (list left, thread
                     right on desktop; list OR thread fullscreen on mobile), same as the app's
                     ChatListPage/ConversationPage. #dm-list and #dm-thread's *contents* are
                     rebuilt by community.js (renderDM()/openConversation()) same as before, but
                     the outer .hub-dm-layout/#dm-list/#dm-thread/#chat-thread elements themselves
                     are now static — chat.js binds to #chat-thread's children once at module
                     load, so they can never be wiped by an innerHTML rebuild the way a plain
                     empty #view-dm used to be. Only one of #dm-thread/#chat-thread is shown at a
                     time (community.js's openGeneralChat()/closeGeneralChat()). -->
                <div class="hub-view" id="view-dm">
                    <div class="hub-dm-layout" id="dm-layout">
                        <div class="hub-dm-list" id="dm-list"></div>
                        <div class="hub-dm-thread" id="dm-thread"></div>
                        <div class="hub-dm-thread" id="chat-thread" hidden>
                            <div class="hub-dm-thread__header">
                                <button class="hub-dm-back-btn" id="chat-back" aria-label="Back">←</button>
                                <div class="hub-dm-conv__avatar" style="width:30px;height:30px;font-size:.9rem">💬</div>
                                <span style="color:var(--text-light);font-weight:600;font-size:.9rem" data-i18n="community_chat_header">Community chat</span>
                            </div>
                            <div class="hub-dm-messages" id="chat-messages">
                                <div class="hub-dm-empty" id="chat-loading" data-i18n="community_chat_loading">Loading messages...</div>
                            </div>
                            <div class="hub-dm-compose-dock" id="chat-input-area">
                                <div class="chat-login-notice" id="chat-login-notice" hidden>
                                    <p><span data-i18n="community_chat_login_notice">You must be logged in to send messages.</span> <a href="login.html" data-i18n="community_chat_login">Log in</a></p>
                                </div>
                                <div class="chat-login-notice" id="chat-muted-notice" hidden>
                                    <p><span id="chat-muted-text"></span></p>
                                </div>
                                <form class="hub-dm-form" id="chat-form" hidden>
                                    <div class="hub-dm-form__field">
                                        <textarea class="hub-dm-form__input" id="chat-input" placeholder="Write a message..." data-i18n="community_chat_placeholder" data-i18n-attr="placeholder" maxlength="500" rows="1" autocomplete="off"></textarea>
                                        <button type="submit" class="hub-dm-form__mic-send-btn hub-dm-form__mic-send-btn--send" id="chat-send-btn" title="Send" data-i18n="community_chat_send" data-i18n-attr="title">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="hub-view" id="view-photos"></div>
            </main>
        </div>
    </div>
