<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===========================
         ARTICLES — blog list page
         Public listing of admin-written articles/news; admin sees a
         "Write article" button that opens the create modal.
         =========================== -->
    <meta charset="UTF-8">
    <script>!function(){var t=localStorage.getItem("cnote-theme");if(t===null)t="dark";if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;var a=localStorage.getItem("cnote-accent-color");if(a&&localStorage.getItem("cn_session")){var r=parseInt(a.slice(1,3),16),g=parseInt(a.slice(3,5),16),b=parseInt(a.slice(5,7),16),s=document.documentElement.style;s.setProperty("--accent-color",a);s.setProperty("--accent-light","#"+[r,g,b].map(function(c){return Math.min(255,Math.floor(c+(255-c)*.2)).toString(16).padStart(2,"0")}).join(""));s.setProperty("--accent-rgb",r+", "+g+", "+b);s.setProperty("--accent-color-rgb",r+", "+g+", "+b);s.setProperty("--glow-accent","0 0 20px rgba("+r+", "+g+", "+b+", .15)")}}()</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="News, guides and updates from the Console Notebook team.">
    <meta name="theme-color" content="#1B1714">
    <meta property="og:title" content="Articles — Console Notebook">
    <meta property="og:description" content="News, guides and updates from the Console Notebook team.">
    <meta property="og:url" content="https://consolenotebook.com/html/pages/articles.html">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://consolenotebook.com/assets/images/og-image.png">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../../manifest.json">
    <link rel="canonical" href="https://consolenotebook.com/html/pages/articles.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Articles — Console Notebook</title>
    <link rel="stylesheet" href="../../css/main.css?v=20260909">
    <link rel="stylesheet" href="../../css/pages/articles.css">
</head>
<body class="has-mbn">
    <div id="navbar-placeholder"></div>

    <main class="articles-page">
        <div class="container">
            <header class="articles-hero">
                <div>
                    <p class="articles-hero__kicker" data-i18n="articles_hero_kicker">Console Notebook</p>
                    <h1 class="articles-hero__title" data-i18n="articles_hero_title">Articles</h1>
                    <p class="articles-hero__subtitle" data-i18n="articles_hero_subtitle">News, guides and updates from the team</p>
                </div>
                <button type="button" class="hero-button hero-button--syllabus" id="articles-write-btn" hidden>
                    <span data-i18n="articles_write_btn">✎ Write article</span>
                </button>
            </header>

            <div class="articles-loading" id="articles-loading" data-i18n="articles_loading">Loading…</div>
            <div class="articles-empty" id="articles-empty" hidden>
                <span class="articles-empty__icon">📰</span>
                <p data-i18n="articles_empty">No articles yet — check back soon.</p>
            </div>
            <div class="articles-grid" id="articles-grid"></div>

            <button type="button" class="articles-load-more" id="articles-load-more" hidden data-i18n="articles_load_more">Load more</button>
        </div>
    </main>

    <!-- Write/Edit article modal (admin only) -->
    <div class="article-modal-overlay" id="article-modal-overlay" hidden>
        <div class="article-modal">
            <button type="button" class="article-modal__close" id="article-modal-close" aria-label="Close">&times;</button>
            <h2 data-i18n="articles_modal_title">Write article</h2>
            <form id="article-form">
                <label class="article-form__label" data-i18n="articles_field_title">Title</label>
                <input type="text" id="article-title-input" class="hub-form-input" maxlength="200" required>

                <label class="article-form__label" data-i18n="articles_field_excerpt">Excerpt</label>
                <textarea id="article-excerpt-input" class="hub-form-textarea" rows="2" maxlength="400" data-i18n="articles_excerpt_placeholder" data-i18n-attr="placeholder" placeholder="Short summary shown on the articles grid…"></textarea>

                <label class="article-form__label" data-i18n="articles_field_cover">Cover image</label>
                <div class="article-cover-upload">
                    <img class="article-cover-upload__preview" id="article-cover-preview" hidden alt="">
                    <label class="hero-button hero-button--syllabus article-cover-upload__btn">
                        <span data-i18n="articles_upload_cover">Upload cover image</span>
                        <input type="file" id="article-cover-input" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
                    </label>
                    <span class="article-cover-upload__status" id="article-cover-status"></span>
                </div>

                <label class="article-form__label" data-i18n="articles_field_content">Content (HTML)</label>
                <textarea id="article-content-input" class="hub-form-textarea article-form__content" rows="14" data-i18n="articles_content_placeholder" data-i18n-attr="placeholder" placeholder="&lt;p&gt;Write your article here…&lt;/p&gt;" required></textarea>

                <label class="article-form__checkbox">
                    <input type="checkbox" id="article-published-input" checked>
                    <span data-i18n="articles_field_published">Published (visible to everyone)</span>
                </label>

                <div class="article-form__actions">
                    <button type="button" class="hub-btn hub-btn--secondary" id="article-form-cancel" data-i18n="articles_cancel">Cancel</button>
                    <button type="submit" class="hub-btn hub-btn--primary" id="article-form-submit" data-i18n="articles_publish">Publish</button>
                </div>
            </form>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script type="module" src="../../js/main.js?v=20260909"></script>
    <script type="module" src="../../js/pages/articles.js"></script>
    <script src="/js/cookie-consent.js"></script>
    <script src="../js/components.js"></script>
</body>
</html>
